name: my_template
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  logger: ^2.6.2
  dio: ^5.9.0
  get_it: ^9.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_bloc: ^9.1.1
  iconly: ^1.0.1
  smooth_page_indicator: ^2.0.1
  flutter_svg: ^2.2.3
  svg_image_provider: ^0.1.1
  dashed_progress_bar: ^0.0.1
  internet_connection_checker_plus: ^2.9.1+2
  google_nav_bar: ^5.0.7
  line_icons: ^2.0.3
  skeletonizer: ^2.1.2
  flutter_rating: ^2.0.2
  intl: ^0.20.2
  my_progress_bar: ^2.1.0
  confetti: ^0.8.0
  dotted_border: ^3.1.0
  family_bottom_sheet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/onboarding_images/
    - assets/images/
    - assets/home_page/


